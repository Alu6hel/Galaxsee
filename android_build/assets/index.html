    <script>
      // Android Native Bridge auto-loader
      (function() {
        try {
          if (window.GalaxseeAndroid && typeof window.GalaxseeAndroid.getDevicePhotosJson === 'function') {
            var raw = window.GalaxseeAndroid.getDevicePhotosJson();
            if (raw) {
              var photos = JSON.parse(raw);
              if (Array.isArray(photos) && photos.length > 0) {
                localStorage.setItem('galaxsee_imported_photos', JSON.stringify(photos));
                console.log('Galaxsee Android: Preloaded ' + photos.length + ' device photos into gallery.');
              }
            }
          }
        } catch (e) {
          console.error('Galaxsee Android init error:', e);
        }
      })();
    </script>
