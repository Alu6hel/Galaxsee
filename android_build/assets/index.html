    <script>
      // Android Native Bridge initial photo loader
      (function() {
        try {
          if (window.GalaxseeAndroid && typeof window.GalaxseeAndroid.getInitialOpenedPhotoJson === 'function') {
            var openedRaw = window.GalaxseeAndroid.getInitialOpenedPhotoJson();
            if (openedRaw) {
              var openedPhoto = JSON.parse(openedRaw);
              if (openedPhoto && openedPhoto.id) {
                window.__galaxsee_initial_opened_photo = openedPhoto;
                console.log('Galaxsee Android: Preloaded opened external photo:', openedPhoto.title);
              }
            }
          }
        } catch (e) {
          console.error('Galaxsee Android init error:', e);
        }
      })();
    </script>

/* Galaxsee Mobile Responsive Navigation & Drawer */
@media (max-width: 767px) {
  #galaxsee-sidebar {
    position: fixed !important;
    top: 0 !important;
    bottom: 0 !important;
    left: 0 !important;
    height: 100vh !important;
    width: 270px !important;
    max-width: 80vw !important;
    z-index: 50 !important;
    transform: translateX(-100%) !important;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    box-shadow: none !important;
    display: flex !important;
  }
  #galaxsee-sidebar.mobile-open {
    transform: translateX(0) !important;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85) !important;
  }
  #galaxsee-sidebar .truncate {
    display: inline !important;
  }
  main {
    width: 100% !important;
    max-width: 100vw !important;
  }
}

@media (min-width: 768px) {
  #galaxsee-sidebar {
    position: static !important;
    transform: none !important;
    transition: width 0.2s ease !important;
  }
}

.galaxsee-backdrop {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  background-color: rgba(0, 0, 0, 0.65) !important;
  backdrop-filter: blur(4px) !important;
  -webkit-backdrop-filter: blur(4px) !important;
  z-index: 45 !important;
}
@media (min-width: 768px) {
  .galaxsee-backdrop {
    display: none !important;
  }
}
